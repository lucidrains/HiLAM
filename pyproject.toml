[project]
name = "HiLAM"
version = "0.0.1"
description = "Implementation of the Hierarchical Latent Action Model"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'robotics',
    'latent actions',
    'dynamic action chunking',
    'hierarchical'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einx>=0.3.0",
    "einops>=0.8.1",
    "h-net-dynamic-chunking>=0.4.0",
    "torch>=2.5",
    "torch-einops-utils>=0.0.29",
    "vector-quantize-pytorch>=1.28.2",
    "x-transformers>=2.18.9"
]

[project.urls]
Homepage = "https://pypi.org/project/HiLAM/"
Repository = "https://codeberg.org/lucidrains/HiLAM"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "HiLAM",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["HiLAM"]
